name: Build & Test

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: swift build + swift test + signed .app
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Build (debug)
        run: swift build

      - name: Test
        run: swift test

      - name: Assemble ad-hoc signed .app
        run: bash scripts/build-app.sh 0.0.0-dev

      - name: Verify bundle structure
        run: |
          test -f build/SakuraSwitch.app/Contents/MacOS/SakuraSwitch
          test -f build/SakuraSwitch.app/Contents/Info.plist
          test -f build/SakuraSwitch.app/Contents/Resources/AppIcon.icns
          plutil -lint build/SakuraSwitch.app/Contents/Info.plist
          codesign --verify --strict --all-architectures build/SakuraSwitch.app
          lipo build/SakuraSwitch.app/Contents/MacOS/SakuraSwitch -verify_arch arm64 x86_64
          file build/SakuraSwitch.app/Contents/MacOS/SakuraSwitch

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: SakuraSwitch-ad-hoc-signed
          path: build/SakuraSwitch.app
