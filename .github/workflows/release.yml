name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.1.0)"
        required: true
        default: "1.1.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed app in DMG + ZIP → GitHub Release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Sakura Switch $VERSION"

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-release-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-release-

      - name: Package DMG + ZIP (ad-hoc signed app)
        run: bash scripts/package-dmg.sh "${{ steps.version.outputs.version }}"

      - name: Verify release app
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$(cat VERSION)" = "$RELEASE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/SakuraSwitch.app/Contents/Info.plist)" = "$RELEASE_VERSION"
          codesign --verify --strict --all-architectures build/SakuraSwitch.app
          lipo -verify_arch arm64 x86_64 build/SakuraSwitch.app/Contents/MacOS/SakuraSwitch

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { inblock = 1; next }
            inblock && /^## \[/ { exit }
            inblock { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "No changelog section for $VERSION — using a fallback note." >&2
            printf 'Sakura Switch %s — ad-hoc signed app, without notarization.\n\nSee CHANGELOG.md for details.\n' "$VERSION" > release-notes.md
          fi
          cat release-notes.md

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: Sakura Switch ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            build/SakuraSwitch.dmg
            build/SakuraSwitch.zip
          fail_on_unmatched_files: true
